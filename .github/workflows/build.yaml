name: Build Amp Runner

on:
  push:
    branches: [main]
    paths:
      - amp_runner/**
      - .github/workflows/build.yaml
  pull_request:
    paths:
      - amp_runner/**
      - .github/workflows/build.yaml

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - name: Read add-on metadata
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: ./amp_runner
      - name: Normalize JSON-encoded version
        id: version
        env:
          RAW_VERSION: ${{ steps.info.outputs.version }}
        run: echo "value=$(jq -r . <<< "$RAW_VERSION")" >> "$GITHUB_OUTPUT"
      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ha-amp-runner
          registry-prefix: ghcr.io/nclandrei

  build:
    name: Build ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and push image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./amp_runner
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          labels: |
            io.hass.type=app
            org.opencontainers.image.source=https://github.com/nclandrei/HAmp
          push: ${{ github.event_name == 'push' }}
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish multi-architecture image
    needs: [prepare, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ha-amp-runner
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ghcr.io/nclandrei
